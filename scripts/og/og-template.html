<!DOCTYPE html>
<html lang="fi">
<!-- SAMA Energia — Open Graph -kuvan malli (1200×630).
     04.11.2026 (v43): etusivun otsikko (I-20261104-3), kultainen logo sellaisenaan (assets/mark.svg), heron yöpaletti ja oletuskohde oikealla
     (FI viljankuivuri, ET teollisuus), sama vasemmalta tummuva liukuma kuin herossa.
     Renderöinti: node scripts/og/render-og.mjs  → assets/og-fi.png ja assets/og-et.png
     Kielen valinta kyselyparametrilla: og-template.html?lang=fi | ?lang=et -->
<head>
<meta charset="utf-8">
<title>SAMA Energia — OG</title>
<link rel="stylesheet" href="../../assets/fonts.css">
<style>
  :root{--night:#0B0B0A;--gold:#D9BC7E;--ink:#F3EEE1;--ink-2:#BFB6A5}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--night);position:relative;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .scene{position:absolute;right:-150px;top:-30px;width:1260px;height:717px;object-fit:cover}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,#0B0B0A 0%,rgba(11,11,10,.96) 34%,rgba(11,11,10,.55) 52%,rgba(11,11,10,0) 68%),
    linear-gradient(180deg,rgba(11,11,10,.6) 0%,rgba(11,11,10,0) 22%,rgba(11,11,10,0) 80%,rgba(11,11,10,.7) 100%)}
  .logo{position:absolute;left:80px;top:62px;height:74px;width:auto}
  h1{position:absolute;left:80px;top:200px;width:700px;
     font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:62px;line-height:1.06;
     letter-spacing:-.018em;color:var(--ink)}
  h1 em{font-style:italic;color:var(--gold)}
  .domain{position:absolute;left:80px;top:540px;font-size:24px;font-weight:400;color:var(--ink-2)}
</style>
</head>
<body>
  <img class="scene" id="s" src="" alt="">
  <div class="shade"></div>
  <img class="logo" src="../../assets/mark.svg" alt="">
  <h1 id="t"></h1>
  <p class="domain" id="d"></p>
<script>
  var COPY = {
    fi: { h: 'Sähköliittymänne<br><em>on omaisuutta.</em><br>Laittakaa se töihin<br>omaksi eduksenne.', d: 'samaenergia.fi', s: '../../assets/k-obj-kuivati-1920.webp' },
    et: { h: 'Teie elektriliitumine<br><em>on vara.</em> Pange see<br>enda kasuks tööle.', d: 'samaenergia.ee', s: '../../assets/k-hero-1920.webp' }
  };
  var lang = (location.search.match(/lang=(fi|et)/) || [])[1] || 'fi';
  document.documentElement.lang = lang;
  document.getElementById('t').innerHTML = COPY[lang].h;
  document.getElementById('d').textContent = COPY[lang].d;
  document.getElementById('s').src = COPY[lang].s;
</script>
</body>
</html>
