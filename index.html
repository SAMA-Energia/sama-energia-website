<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMA Energia</title>
<meta name="description" content="SAMA Energia — sähkövarastot teollisuus- ja yrityskohteisiin. Energiasalvestid tööstus- ja äriklientidele.">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1F4A38;
    --copper:#A9663B;
    --concrete:#EEEFEC;
    --line:#D8DAD4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--concrete);
    color:var(--green);
    font-family:"IBM Plex Mono",monospace;
    display:flex;
    flex-direction:column;
    min-height:100svh;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:8vh 6vw;
    max-width:720px;
  }
  .wordmark{
    font-family:"Schibsted Grotesk",sans-serif;
    font-weight:700;
    font-size:clamp(2.4rem,7vw,4.2rem);
    letter-spacing:-0.02em;
    line-height:1.05;
  }
  .wordmark span{color:var(--copper)}
  .status{
    margin-top:1.1rem;
    font-size:0.8rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--copper);
  }
  .peak{
    margin:3.2rem 0 2.8rem;
    width:100%;
    max-width:420px;
  }
  .peak svg{display:block;width:100%;height:auto}
  .desc{
    display:grid;
    gap:0.9rem;
    font-size:0.92rem;
    line-height:1.55;
  }
  .desc p{max-width:46ch}
  .desc .lang{
    font-size:0.68rem;
    letter-spacing:0.18em;
    color:var(--copper);
    display:block;
    margin-bottom:0.15rem;
  }
  footer{
    padding:2rem 6vw;
    border-top:1px solid var(--line);
    font-size:0.72rem;
    letter-spacing:0.08em;
    color:var(--green);
    opacity:0.75;
  }
  @media (prefers-reduced-motion:no-preference){
    .peak path.shave{
      stroke-dasharray:600;
      stroke-dashoffset:600;
      animation:draw 1.6s ease-out 0.3s forwards;
    }
    @keyframes draw{to{stroke-dashoffset:0}}
  }
</style>
</head>
<body>
<main>
  <h1 class="wordmark">SAMA<br>Energia<span>.</span></h1>
  <p class="status">Tulossa &middot; Tulekul</p>

  <div class="peak" aria-hidden="true">
    <svg viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- original demand curve with peak, dotted -->
      <path d="M0 95 L60 88 L110 70 L150 30 L190 22 L230 34 L280 74 L340 86 L420 92"
            stroke="#A9663B" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.55"/>
      <!-- shaved curve, solid -->
      <path class="shave" d="M0 95 L60 88 L110 70 L140 58 L250 58 L280 74 L340 86 L420 92"
            stroke="#1F4A38" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- cap line -->
      <line x1="0" y1="58" x2="420" y2="58" stroke="#1F4A38" stroke-width="1" stroke-dasharray="1 6" opacity="0.4"/>
    </svg>
  </div>

  <div class="desc">
    <p><span class="lang">FI</span>Sähkövarastot teollisuus- ja yrityskohteisiin. Sivusto avautuu pian.</p>
    <p><span class="lang">ET</span>Energiasalvestid tööstus- ja äriklientidele. Veebileht avaneb peagi.</p>
  </div>
</main>
<footer>&copy; 2026 SAMA Energia</footer>
</body>
</html>
